<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS - Chapter 1: Stone Age</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/chapter1.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo" id="nav-logo">CHRONOS</a>
        </div>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="index.html?era=0" id="nav-back">Back to Eras</a></li>
            </ul>
            <!-- Language Switcher -->
            <button id="lang-toggle" class="control-btn" aria-label="Toggle Language">
                <span id="lang-text">TH</span>
            </button>
        </div>
    </nav>

    <!-- Scroll Spacer -->
    <div class="scroll-container"></div>

    <!-- Parallax Viewport -->
    <div class="parallax-viewport">
        <!-- Z-Index Matrix layers -->
        <img src="assets/img/sky-base.PNG" class="layer layer-sky" alt="Sky">

        <img src="assets/img/sun-rising.PNG" class="layer layer-sun" id="layer-sun" alt="Sun">

        <img src="assets/img/clouds-bg.PNG" class="layer layer-clouds-bg" id="layer-clouds-bg" alt="Clouds Background">

        <img src="assets/img/clouds-fg.PNG" class="layer layer-clouds-fg" id="layer-clouds-fg" alt="Clouds Foreground">

        <img src="assets/img/savanna-ground.PNG" class="layer layer-ground" alt="Savanna Ground">

        <img src="assets/img/Derr.png" class="layer layer-deer" id="layer-deer" alt="Deer">
        <img src="assets/img/Elephant2.png" class="layer layer-elephant" id="layer-elephant" alt="Elephant">
        <img src="assets/img/Lion2.png" class="layer layer-lion" id="layer-lion" alt="Lion">
        <img src="assets/img/Giraffe.png" class="layer layer-giraffe" id="layer-giraffe" alt="Giraffe">

        <img src="assets/img/bird.png" class="layer layer-bird" id="layer-bird" alt="bird">

        <img src="assets/img/cave-entrance.PNG" class="layer layer-cave-entrance" id="layer-cave-entrance"
            alt="Cave Entrance">

        <img src="assets/img/cave-midground.PNG" class="layer layer-cave-mid" id="layer-cave-mid" alt="Cave Midground">

        <img src="assets/img/cave-foreground.PNG" class="layer layer-cave-front" id="layer-cave-front"
            alt="Cave Foreground">

        <!-- Phase 0: Prologue Overlay -->
        <div class="black-overlay" id="black-overlay"></div>
        <div class="prologue-container" id="prologue-container">
            <p class="prologue-text" id="prologue-1"></p>
            <p class="prologue-text" id="prologue-2"></p>
            <p class="prologue-text" id="prologue-3"></p>
            <p class="prologue-text" id="prologue-4"></p>
        </div>

        <!-- Phase 4: Savanna Text Overlay -->
        <div class="savanna-text-container" id="savanna-text-container">
            <p id="savanna-text"></p>
        </div>

        <!-- Phase 5: Story Continuation -->
        <img src="assets/img/Bg3.PNG" class="layer layer-phase5 layer-bg3" id="layer-bg3" alt="Background 3">
        <img src="assets/img/Sun4.png" class="layer layer-phase5 layer-sun4" id="layer-sun4" alt="Sun 4">
        <img src="assets/img/Grass.PNG" class="layer layer-phase5 layer-grass" id="layer-grass" alt="Grass">
        <img src="assets/img/Shadow_hibilis.PNG" class="layer layer-phase5 layer-shadow-habilis"
            id="layer-shadow-habilis" alt="Shadow Habilis">
        <img src="assets/img/Shadow_erectus.PNG" class="layer layer-phase5 layer-shadow-erectus"
            id="layer-shadow-erectus" alt="Shadow Erectus">

        <!-- Footprints moving at the bottom -->
        <div class="footprints-container layer-phase5" id="footprints-container">
            <img src="assets/img/footDino.PNG" class="footprint" id="foot-1" alt="Footprint 1">
            <img src="assets/img/footDino.PNG" class="footprint" id="foot-2" alt="Footprint 2">
            <img src="assets/img/footDino.PNG" class="footprint" id="foot-3" alt="Footprint 3">
            <img src="assets/img/footDino.PNG" class="footprint" id="foot-4" alt="Footprint 4">
            <img src="assets/img/footDino.PNG" class="footprint" id="foot-5" alt="Footprint 5">
        </div>

        <!-- Character Popups -->
        <div class="character-popup" id="popup-habilis">
            <p id="text-popup-habilis"></p>
        </div>
        <div class="character-popup" id="popup-erectus">
            <p id="text-popup-erectus"></p>
        </div>

        <!-- Section Transition Mask -->
        <div class="section-transition-mask" id="section-transition-mask"></div>

        <div class="scene3-text-container" id="scene3-text-container">
            <p id="scene3-text"></p>
        </div>

        <!-- Phase 6: Night Sky -->
        <img src="assets/img/BG_Dark.PNG" class="layer layer-phase6 layer-bg-dark" id="layer-bg-dark"
            alt="Dark Background">
        <img src="assets/img/Star.PNG" class="layer layer-phase6 layer-star" id="layer-star" alt="Stars">
        <img src="assets/img/Moon.PNG" class="layer layer-phase6 layer-moon" id="layer-moon" alt="Moon">

        <!-- Phase 7: Cave Scene (scroll-zoom) -->
        <img src="assets/img/Rockfinal.png" class="layer layer-phase6 layer-rock" id="layer-rock" alt="Rock">
        <img src="assets/img/Cavefinal.png" class="layer layer-phase6 layer-cave-final" id="layer-cave-final"
            alt="Cave Final">

        <!-- Cave props — on top of Cavefinal -->
        <img src="assets/img/Tool.png" class="layer layer-phase6 layer-tool" id="layer-tool" alt="Tool">
        <img src="assets/img/Tool.png" class="layer layer-phase6 layer-tool-2" id="layer-tool-2" alt="Tool 2">
        <img src="assets/img/Fire.png" class="layer layer-phase6 layer-fire" id="layer-fire" alt="Fire">

        <!-- Scene 1.4 Story Text -->
        <div class="scene4-text-container" id="scene4-text-container">
            <p id="scene4-text"></p>
        </div>

        <!-- Cave Prop Popups -->
        <div class="cave-popup" id="popup-tool">
            <p id="text-popup-tool"></p>
        </div>
        <div class="cave-popup" id="popup-tool-2">
            <p id="text-popup-tool-2"></p>
        </div>
        <div class="cave-popup" id="popup-fire">
            <p id="text-popup-fire"></p>
        </div>

        <!-- Scene 1.5 Ending Mask & Text -->
        <div class="ending-black-mask" id="ending-black-mask"></div>
        <div class="scene5-text-container" id="scene5-text-container">
            <p id="scene5-text"></p>
        </div>
    </div>

    <!-- JS -->
    <script src="js/chapter1.js"></script>
</body>

</html>
